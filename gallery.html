<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Gallery - Shalani's Memory Lane">
    <meta name="theme-color" content="#ff758f">
    <title>Gallery | Shalani's Memory Lane</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/theme.css">
    <link rel="stylesheet" href="assets/css/animations.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-nav">
        <div class="nav-brand">
            <a href="index.html#home">Shalani's Memory Lane</a>
        </div>
        <button class="nav-toggle" id="nav-toggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <nav class="nav-links" id="nav-links">
            <a href="index.html#home">Home</a>
            <a href="index.html#journey">Journey</a>
            <a href="index.html#memories">Memories</a>
            <a href="index.html#audio">Audio</a>
            <a href="gallery.html">Gallery</a>
        </nav>
    </header>

    <div class="liquid-bg-container">
        <div class="liquid-blob blob-pink"></div>
        <div class="liquid-blob blob-violet"></div>
    </div>

    <canvas id="particle-canvas"></canvas>

    <!-- Hidden audio element — allows music to resume when navigating from index.html -->
    <audio id="love-audio" preload="metadata" style="display:none">
        <source id="audio-source" src="assets/audio/Nubawa_Soya.mp3" type="audio/mpeg">
    </audio>

    <!-- Floating audio control widget -->
    <div id="audio-control-widget" class="audio-control-widget">
        <button id="widget-play-pause" class="control-btn" aria-label="Play or pause audio">▶</button>
        <button id="widget-mute" class="control-btn" aria-label="Mute audio">🔊</button>
        <div class="widget-track-info">
            <span id="widget-track-title">Soundtrack</span>
            <small id="widget-track-status">Tap to control music</small>
        </div>
    </div>

    <section class="gallery-section" id="gallery">
        <h2 class="section-title">Our Gallery</h2>
        <p class="section-subtitle">Private moments now live on their own page.</p>
        <div class="gallery-grid" id="gallery-grid"></div>
    </section>

    <footer class="footer">
        <p>Made with ❤️ by Menula for Shalani</p>
        <p class="footer-date">2024 - 2025</p>
    </footer>

    <script src="assets/js/theme-engine.js"></script>
    <script src="assets/js/particle-engine.js"></script>
    <script src="assets/js/love-counter.js"></script>
    <script src="app.js"></script>
</body>
</html>
